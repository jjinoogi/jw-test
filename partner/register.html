<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OFF PG 총판 - 하부업체 등록</title>
<link rel="stylesheet" href="../assets/css/style.css?v=2" />
</head>
<body>
<div class="app-shell">
  <div class="topbar" id="topbar"></div>
  <div class="main-content">
    <div class="panel">
      <div class="section-title">업체구분</div>
      <div class="segmented" id="type-seg">
        <button type="button" data-value="영업사" class="active">영업사</button>
        <button type="button" data-value="가맹점">가맹점</button>
      </div>
    </div>

    <div class="panel">
      <div class="section-title">업체정보</div>
      <div class="form-grid">
        <div class="field"><label>업체명</label><input type="text" id="f-name" placeholder="㈜○○○○" /></div>
        <div class="field"><label>사업자등록번호</label><input type="text" id="f-bizno" placeholder="000-00-00000" /></div>
        <div class="field"><label>이메일</label><input type="text" id="f-email" placeholder="example@mail.com" /></div>
        <div class="field"><label>휴대폰번호</label><input type="text" id="f-phone" placeholder="010-0000-0000" /></div>
        <div class="field"><label>대표자명</label><input type="text" id="f-ceo" placeholder="홍길동" /></div>
        <div class="field"><label>업체전화번호</label><input type="text" id="f-tel" placeholder="02-000-0000" /></div>
      </div>
    </div>

    <div class="panel">
      <div class="section-title" id="fee-title">수수료테이블</div>
      <div class="table-wrap">
        <table class="data-table fee-table">
          <thead>
            <tr><th>영중소구분</th><th id="cost-head">원가</th><th id="profit-head">총판수익(%)</th><th>판매가(%)</th></tr>
          </thead>
          <tbody id="fee-body"></tbody>
        </table>
      </div>
      <div class="calc-note">
        <b>계산 규칙 (%기준, 양방향 자동계산)</b>
        <span id="calc-desc"></span>
      </div>

      <div class="actions-row">
        <button class="btn" id="btn-cancel">취소</button>
        <button class="btn btn-primary" id="btn-save">저장</button>
      </div>
    </div>
  </div>
</div>
<script src="../assets/js/data.js?v=2"></script>
<script src="../assets/js/common.js?v=2"></script>
<script>
  var session = OffPGUI.requireSession("partner", "index.html");
  if (session) {
    OffPGUI.renderTopbar({ brand: "OFF PG PARTNER", userName: session.name, loginUrl: "index.html" });

    var parent = OffPG.getById(session.companyId);
    var profitLabel = "총판수익";
    document.getElementById("profit-head").textContent = profitLabel + "(%)";
    document.getElementById("calc-desc").textContent =
      profitLabel + " 입력 → 판매가 = 원가+" + profitLabel + " | 판매가 입력 → " + profitLabel + " = 판매가-원가";

    var selectedType = "영업사";
    document.querySelectorAll("#type-seg button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll("#type-seg button").forEach(function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        selectedType = btn.getAttribute("data-value");
      });
    });

    document.getElementById("cost-head").textContent = parent.settleCycle + " 원가";

    document.getElementById("fee-body").innerHTML = OffPG.ROWS.map(function (row) {
      var cost = round1(parent.feeTable[row].sale != null ? parent.feeTable[row].sale : parent.feeTable[row].cost);
      return (
        "<tr data-row='" + row + "' data-cost='" + cost + "'>" +
        "<td>" + row + "</td>" +
        "<td class='dash'>" + cost + "%</td>" +
        "<td><input type='text' class='inp-profit' placeholder='%' /></td>" +
        "<td><input type='text' class='inp-sale' placeholder='%' /></td>" +
        "</tr>"
      );
    }).join("");

    function round1(n) { return Math.round(n * 10) / 10; }

    document.querySelectorAll("#fee-body tr").forEach(function (tr) {
      var cost = parseFloat(tr.getAttribute("data-cost"));
      var profitInput = tr.querySelector(".inp-profit");
      var saleInput = tr.querySelector(".inp-sale");
      profitInput.addEventListener("input", function () {
        var p = parseFloat(profitInput.value);
        saleInput.value = isNaN(p) ? "" : round1(cost + p);
      });
      saleInput.addEventListener("input", function () {
        var s = parseFloat(saleInput.value);
        profitInput.value = isNaN(s) ? "" : round1(s - cost);
      });
    });

    document.getElementById("btn-cancel").addEventListener("click", function () {
      window.location.href = "list.html";
    });

    document.getElementById("btn-save").addEventListener("click", function () {
      var name = document.getElementById("f-name").value.trim();
      var bizNo = document.getElementById("f-bizno").value.trim();
      if (!name || !bizNo) {
        OffPGUI.toast("업체명과 사업자등록번호를 입력해주세요.");
        return;
      }
      var profitByRow = {};
      document.querySelectorAll("#fee-body tr").forEach(function (tr) {
        var row = tr.getAttribute("data-row");
        var p = parseFloat(tr.querySelector(".inp-profit").value);
        profitByRow[row] = isNaN(p) ? 0.3 : p;
      });

      OffPG.childAddCompany(session.companyId, {
        type: selectedType,
        name: name,
        bizNo: bizNo,
        email: document.getElementById("f-email").value.trim(),
        phone: document.getElementById("f-phone").value.trim(),
        ceo: document.getElementById("f-ceo").value.trim(),
        tel: document.getElementById("f-tel").value.trim(),
        loginId: selectedType === "영업사" ? "agn-" + OffPG.utils.uid("").slice(1) : null,
        loginPw: selectedType === "영업사" ? "1234" : null,
        profitByRow: profitByRow
      });

      OffPGUI.toast("하부업체가 등록되었습니다.");
      window.location.href = "list.html";
    });
  }
</script>
</body>
</html>
