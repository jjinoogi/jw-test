<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OFF PG 관리자 로그인</title>
<link rel="stylesheet" href="../assets/css/style.css?v=2" />
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <h1>OFF PG 관리자</h1>
    <div class="sub">ADMIN LOGIN</div>
    <hr />
    <form id="login-form">
      <div class="field">
        <label>아이디</label>
        <input type="text" id="login-id" placeholder="admin id" autocomplete="username" />
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" id="login-pw" placeholder="••••••" autocomplete="current-password" />
      </div>
      <div class="remember-row">
        <input type="checkbox" id="remember" />
        <label for="remember">로그인 상태 유지</label>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">로그인</button>
    </form>
    <a href="#" class="forgot" onclick="OffPGUI.toast('데모 화면에서는 지원하지 않는 기능입니다.'); return false;">비밀번호를 잊으셨나요?</a>
    <div class="login-hint">데모 계정: 아이디/비밀번호를 아무 값이나 입력 후 로그인 버튼을 누르면 통과됩니다.</div>
  </div>
</div>
<script src="../assets/js/data.js?v=2"></script>
<script src="../assets/js/common.js?v=2"></script>
<script>
  document.getElementById("login-form").addEventListener("submit", function (e) {
    e.preventDefault();
    OffPG.session.set({ role: "admin", companyId: null, name: "관리자" });
    window.location.href = "dashboard.html";
  });
</script>
</body>
</html>
