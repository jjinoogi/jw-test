<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OFF PG 관리자 - 업체관리</title>
<link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
<div class="app-shell">
  <div class="topbar" id="topbar"></div>
  <div class="with-sidebar">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-content">
      <div class="panel">
        <div class="filter-bar">
          <select id="f-type">
            <option value="">업체구분 전체</option>
            <option value="총판">총판</option>
            <option value="영업사">영업자</option>
            <option value="가맹점">가맹점</option>
          </select>
          <input type="text" id="f-keyword" placeholder="업체명 / 사업자번호 검색" />
          <button class="btn" id="btn-search">검색</button>
          <div class="spacer"></div>
          <button class="btn btn-primary" id="btn-add">+ 등록</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>No</th><th>업체구분</th><th>업체명</th><th>사업자등록번호</th>
                <th>정산주기</th><th>계약진행상황</th><th>단말기개통현황</th><th>관리</th>
              </tr>
            </thead>
            <tbody id="list-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/common.js"></script>
<script>
  var session = OffPGUI.requireSession("admin", "index.html");
  if (session) {
    OffPGUI.renderTopbar({ brand: "OFF PG ADMIN", userName: session.name, loginUrl: "index.html" });
    OffPGUI.renderSidebar("companies", "");

    function currentList() {
      var type = document.getElementById("f-type").value;
      var kw = document.getElementById("f-keyword").value.trim().toLowerCase();
      return OffPG.all()
        .filter(function (c) {
          return !type || c.type === type;
        })
        .filter(function (c) {
          if (!kw) return true;
          return c.name.toLowerCase().indexOf(kw) !== -1 || c.bizNo.toLowerCase().indexOf(kw) !== -1;
        })
        .sort(function (a, b) {
          return b.regDate.localeCompare(a.regDate);
        });
    }

    function render() {
      var list = currentList();
      document.getElementById("list-body").innerHTML = list
        .map(function (c, i) {
          return (
            "<tr>" +
            "<td>" + (list.length - i) + "</td>" +
            "<td>" + c.type + "</td>" +
            "<td class='left'><b>" + OffPGUI.escapeHtml(c.name) + "</b></td>" +
            "<td>" + c.bizNo + "</td>" +
            "<td>" + c.settleCycle + "</td>" +
            "<td>" + OffPGUI.statusDropdown(c.id, "contractStatus", c.contractStatus, OffPG.CONTRACT_STATUSES, "green") + "</td>" +
            "<td>" + OffPGUI.statusDropdown(c.id, "deviceStatus", c.deviceStatus, OffPG.DEVICE_STATUSES, "amber") + "</td>" +
            "<td><button class='btn btn-sm' data-detail='" + c.id + "'>상세</button></td>" +
            "</tr>"
          );
        })
        .join("");

      OffPGUI.wireStatusDropdowns(function (id, field, value) {
        if (field === "contractStatus") OffPG.setContractStatus(id, value);
        if (field === "deviceStatus") OffPG.setDeviceStatus(id, value);
        OffPGUI.toast("상태가 변경되었습니다.");
        render();
      });

      document.querySelectorAll("[data-detail]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          showDetail(btn.getAttribute("data-detail"));
        });
      });
    }

    function showDetail(id) {
      var c = OffPG.getById(id);
      var rowsHtml = OffPG.ROWS.map(function (row) {
        var f = c.feeTable[row];
        return (
          "<tr><td>" + row + "</td><td>" + f.cost + "%</td>" +
          "<td>" + (f.profit == null ? "-" : f.profit + "%") + "</td>" +
          "<td>" + (f.sale == null ? "-" : f.sale + "%") + "</td></tr>"
        );
      }).join("");
      OffPGUI.openModal(
        '<div class="modal-head">업체 상세정보 - ' + OffPGUI.escapeHtml(c.name) + '</div>' +
        '<div class="modal-body">' +
        '<h3>업체정보</h3>' +
        '<div class="kv-grid">' +
        '<div><div class="k">업체명</div><div class="v">' + OffPGUI.escapeHtml(c.name) + '</div></div>' +
        '<div><div class="k">사업자등록번호</div><div class="v">' + c.bizNo + '</div></div>' +
        '<div><div class="k">이메일</div><div class="v">' + OffPGUI.escapeHtml(c.email) + '</div></div>' +
        '<div><div class="k">휴대폰번호</div><div class="v">' + c.phone + '</div></div>' +
        '<div><div class="k">대표자명</div><div class="v">' + OffPGUI.escapeHtml(c.ceo) + '</div></div>' +
        '<div><div class="k">업체전화번호</div><div class="v">' + c.tel + '</div></div>' +
        '</div>' +
        '<h3>수수료테이블</h3>' +
        '<table class="data-table fee-table"><thead><tr><th>영중소구분</th><th>원가</th><th>수익</th><th>판매가</th></tr></thead><tbody>' + rowsHtml + '</tbody></table>' +
        '</div>' +
        '<div class="modal-foot"><button class="btn" data-close-modal>닫기</button></div>'
      );
    }

    document.getElementById("btn-search").addEventListener("click", render);
    document.getElementById("f-type").addEventListener("change", render);
    document.getElementById("btn-add").addEventListener("click", function () {
      window.location.href = "company-form.html";
    });

    render();
  }
</script>
</body>
</html>
